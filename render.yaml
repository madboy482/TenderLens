services:
  - type: web
    name: tenderlens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        value: sqlite:///./data/tenderlens.db
      - key: STORAGE_ROOT
        value: ./data/uploads
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: LLM_PROVIDER
        value: mock
      - key: FRONTEND_ORIGIN
        sync: false
